}
stSel.value = 'ST0065';

function mkChart(ctx, title) {
  return new Chart(ctx, {
    type: 'line',
    data: { labels: hours, datasets: [
      { label: '실제', data: [], borderColor: '#2f6fdd', backgroundColor: '#2f6fdd', tension: .25 },
      { label: '예측', data: [], borderColor: '#ff8c26', backgroundColor: '#ff8c26', borderDash: [6,4], tension: .25 },
    ]},
    options: {
      plugins: { title: { display: true, text: title, font: { size: 15 } } },
      scales: { y: { beginAtZero: true, title: { display: true, text: '건수' } },
                x: { title: { display: true, text: '시간' } } },
      animation: { duration: 250 },
    }
  });
}

function draw() {
  const sid = stSel.value, d = document.getElementById('date').value;
  const rec = (PAYLOAD.data[sid] || {})[d];
  if (!rec) { alert(d + ' 데이터가 없어요 (2026-02-01 ~ 02-28만 가능)'); return; }

  rentChart.data.datasets[0].data = rec.ra;
  rentChart.data.datasets[1].data = rec.rp;
  rentChart.options.plugins.title.text = d + ' ' + sid + ' — 대여';
  rentChart.update();

  returnChart.data.datasets[0].data = rec.ta;
  returnChart.data.datasets[1].data = rec.tp;
  returnChart.options.plugins.title.text = d + ' ' + sid + ' — 반납';
  returnChart.update();

  const sum = a => a.reduce((x,y)=>x+y,0);
  document.getElementById('c_ra').textContent = sum(rec.ra) + '건';
  document.getElementById('c_rp').textContent = sum(rec.rp).toFixed(1) + '건';
  document.getElementById('c_ta').textContent = sum(rec.ta) + '건';
  document.getElementById('c_tp').textContent = sum(rec.tp).toFixed(1) + '건';

  const mae = (a,p) => (a.reduce((s,v,i)=>s+Math.abs(v-p[i]),0)/24).toFixed(2);
  document.getElementById('c_mae').textContent = mae(rec.ra,rec.rp) + ' / ' + mae(rec.ta,rec.tp);

  const tmin = Math.min(...rec.temp), tmax = Math.max(...rec.temp);
  const rain = sum(rec.precip);
  document.getElementById('wx').textContent =
    '기온 ' + tmin.toFixed(1) + '~' + tmax.toFixed(1) + '℃' + (rain > 0 ? ' · 강수 ' + rain.toFixed(1) + 'mm' : ' · 강수 없음');
}

window.addEventListener('DOMContentLoaded', () => {
  rentChart = mkChart(document.getElementById('rentChart'), '대여');
  returnChart = mkChart(document.getElementById('returnChart'), '반납');
  stSel.addEventListener('change', draw);
  document.getElementById('date').addEventListener('change', draw);
  draw();
});
</script>
</body>
</html>
